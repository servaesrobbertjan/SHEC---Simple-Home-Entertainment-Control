<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>SHEC Remote</title>
<style>
  :root {
    --bg: #111318; --panel: #1b1e26; --line: #2a2f3a; --text: #e8eaf0; --dim: #8d94a5;
    --accent: #4f8cff; --yt: #ff4e45; --tw: #a970ff; --ok: #3ccf8e; --err: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; padding: 12px 16px 4px; font-size: 18px; letter-spacing: .5px; }
  nav { display: flex; gap: 4px; padding: 8px 12px 10px; }
  nav button { flex: 1; padding: 9px 0; border: 0; border-radius: 10px; background: var(--panel);
               color: var(--dim); font: inherit; font-weight: 600; }
  nav button.active { background: var(--accent); color: #fff; }
  main { padding: 12px 16px; }
  .tab { display: none; } .tab.active { display: block; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  input, select { flex: 1; min-width: 0; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
                  background: var(--panel); color: var(--text); font: inherit; }
  .btn { padding: 11px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
         font: inherit; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; background: var(--panel);
          border-radius: 10px; cursor: pointer; }
  .item:active { background: var(--line); }
  .item .ico { width: 22px; text-align: center; flex: none; }
  .item .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item .meta { color: var(--dim); font-size: 12px; }
  .crumbs { color: var(--dim); font-size: 13px; margin-bottom: 10px; overflow-wrap: anywhere; }
  .crumbs a { color: var(--accent); text-decoration: none; }
  .vid { display: flex; gap: 10px; padding: 8px; background: var(--panel); border-radius: 10px; cursor: pointer; }
  .vid img { width: 128px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; flex: none; background: #000; }
  .vid .t { font-weight: 600; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; margin: 0 6px 6px 0;
          background: var(--panel); border-radius: 999px; cursor: pointer; }
  .chip .x { color: var(--dim); padding-left: 4px; }
  .hint { color: var(--dim); font-size: 13px; }
  .live { color: var(--yt); font-weight: 700; font-size: 11px; }
  .favs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px; padding: 2px 0 14px; }
  .fav { min-width: 0; text-align: center; cursor: pointer; font-size: 11px; color: var(--dim); }
  .fav img, .fav .ph { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block;
                       margin: 0 auto 4px; background: var(--panel); border: 2px solid var(--line); }
  .fav.on img, .fav.on .ph { border-color: var(--yt); }
  .fav .ph { line-height: 52px; font-size: 22px; color: var(--text); }
  .fav span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .chhead img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none; }
  .chhead .n { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 9px 0; border: 0; border-radius: 10px; background: var(--panel);
                color: var(--dim); font: inherit; font-weight: 600; }
  .seg button.active { background: var(--line); color: var(--text); }
  .seg .lv { background: var(--yt); color: #fff; }
  .chlink { color: var(--accent); }
  .twbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .tw { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--panel); border-radius: 10px;
        cursor: pointer; position: relative; transition: opacity .3s, filter .3s; }
  .tw .pv { width: 96px; aspect-ratio: 16/9; border-radius: 6px; flex: none; object-fit: cover; background: #000; }
  .tw .ph { width: 96px; aspect-ratio: 16/9; border-radius: 6px; flex: none; display: flex; align-items: center;
            justify-content: center; background: var(--line); font-size: 22px; font-weight: 700; color: var(--tw); }
  .tw .info { flex: 1; min-width: 0; }
  .tw .n { font-weight: 700; }
  .tw .s { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tw.is-live { box-shadow: inset 3px 0 0 var(--tw); }
  .tw.is-live .badge { position: absolute; left: 12px; top: 12px; background: #e91916; color: #fff;
                    font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 3px; }
  .tw.is-off { opacity: .4; filter: grayscale(.8) brightness(.7); }
  .tw.checking { opacity: .7; }
  .tw .del { display: none; border: 0; background: var(--err); color: #fff; border-radius: 8px;
             padding: 8px 12px; font: inherit; font-weight: 700; }
  #twFavs.editing .del { display: block; }
  #twFavs.editing .tw { opacity: 1; filter: none; }
  .star { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: none;
          color: var(--text); font: inherit; white-space: nowrap; }

  #remote { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
            padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 10; }
  #now { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #state { color: var(--dim); font-size: 12px; }
  #bar { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0; overflow: hidden; }
  #bar div { height: 100%; width: 0; background: var(--accent); }
  .ctl { display: flex; justify-content: space-between; gap: 6px; }
  .ctl[hidden], .ctl button[hidden] { display: none; }
  .ctl button { flex: 1; padding: 10px 0; border: 0; border-radius: 10px; background: var(--line);
                color: var(--text); font-size: 17px; }
  .ctl button.main { background: var(--accent); color: #fff; }
  #toast { position: fixed; left: 16px; right: 16px; top: 12px; padding: 12px 14px; border-radius: 10px;
           background: var(--err); color: #fff; z-index: 20; display: none; }
  #toast.ok { background: var(--ok); color: #062; }
</style>
</head>
<body>
<header>
  <h1>SHEC Remote</h1>
  <nav>
    <button data-tab="nas" class="active">NAS</button>
    <button data-tab="yt">YouTube</button>
    <button data-tab="tw">Twitch</button>
    <button data-tab="link">Link</button>
  </nav>
</header>

<main>
  <section id="nas" class="tab active">
    <div class="row"><select id="root"></select></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="row"><input id="filter" type="search" placeholder="Filter this folder…" autocomplete="off" style="display:none"></div>
    <div class="list" id="files"></div>
  </section>

  <section id="yt" class="tab">
    <form class="row" id="ytForm">
      <input id="ytQ" type="search" placeholder="Search, paste a link, or @channel" autocomplete="off" autocapitalize="none">
      <button class="btn">Go</button>
    </form>
    <div class="favs" id="ytFavs"></div>
    <div id="ytHead"></div>
    <div class="list" id="ytResults"></div>
  </section>

  <section id="tw" class="tab">
    <form class="row" id="twForm">
      <input id="twQ" placeholder="Channel name, e.g. shroud" autocomplete="off" autocapitalize="none">
      <button class="btn" style="background:var(--tw)">Play</button>
      <button class="star" type="button" id="twSave" title="Save to favorites">☆</button>
    </form>
    <div class="twbar">
      <span class="hint" id="twInfo">Favorites</span>
      <button class="star" type="button" id="twEdit">Edit</button>
    </div>
    <div class="list" id="twFavs"></div>
  </section>

  <section id="link" class="tab">
    <form class="row" id="linkForm">
      <input id="linkQ" type="url" placeholder="https://..." autocomplete="off">
      <button class="btn">Play</button>
    </form>
    <p class="hint">Any link yt-dlp understands: YouTube, Twitch VODs/clips, Vimeo and many more.</p>
  </section>
</main>

<div id="remote">
  <div id="now">Nothing playing</div>
  <div id="state">stopped</div>
  <div id="bar"><div></div></div>
  <div class="ctl">
    <button data-cmd="seek" data-val="-30">⏪</button>
    <button data-cmd="seek" data-val="-10">↺10</button>
    <button data-cmd="pause" class="main" id="pp">⏯</button>
    <button data-cmd="seek" data-val="+10">10↻</button>
    <button data-cmd="seek" data-val="+30">⏩</button>
  </div>
  <div class="ctl" style="margin-top:6px">
    <button data-cmd="prev" class="pl" hidden>⏮</button>
    <button data-cmd="next" class="pl" hidden>⏭</button>
    <button data-cmd="volume" data-val="-26">🔉</button>
    <button data-cmd="volume" data-val="+26">🔊</button>
    <button data-cmd="fullscreen">⛶</button>
    <button data-cmd="stop">⏹</button>
  </div>
  <div class="ctl" id="dvdPad" style="margin-top:6px" hidden>
    <button data-cmd="key" data-val="disc-menu" style="font-size:13px">Menu</button>
    <button data-cmd="key" data-val="nav-left">◀</button>
    <button data-cmd="key" data-val="nav-up">▲</button>
    <button data-cmd="key" data-val="nav-down">▼</button>
    <button data-cmd="key" data-val="nav-right">▶</button>
    <button data-cmd="key" data-val="nav-activate" class="main" style="font-size:13px">OK</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let pin = store.get("pin", "");

async function api(path, body) {
  const opts = { headers: { "X-Pin": pin } };
  if (body) { opts.method = "POST"; opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opts);
  if (r.status === 401) {
    pin = prompt("PIN:") || ""; store.set("pin", pin);
    return api(path, body);
  }
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

let toastTimer;
function toast(msg, ok) {
  const t = $("#toast"); t.textContent = msg; t.className = ok ? "ok" : ""; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", ok ? 1800 : 5000);
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtTime = s => { s = Math.max(0, s | 0); const h = s / 3600 | 0, m = (s % 3600) / 60 | 0, x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const fmtSize = b => b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(0) + " MB";

async function play(body, label) {
  toast("Starting " + (label || "") + "…", true);
  try { const r = await api("/api/play", body); toast("▶ " + r.title, true); poll(); }
  catch (e) { toast(e.message); }
}

// Tabs
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button, .tab").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); $("#" + b.dataset.tab).classList.add("active");
  store.set("tab", b.dataset.tab);
});
const hashTab = location.hash.slice(1);
const lastTab = ["nas", "yt", "tw", "link"].includes(hashTab) ? hashTab : store.get("tab", "nas");
document.querySelector(`nav button[data-tab="${lastTab}"]`)?.click();

// NAS
async function openDir(root, path) {
  try {
    const d = await api(`/api/browse?root=${encodeURIComponent(root)}&path=${encodeURIComponent(path)}`);
    store.set("nasPos", { root, path: d.path });
    const parts = d.path ? d.path.split("/") : [];
    let crumbs = `<a href="#" data-p="">${esc(root)}</a>`;
    parts.forEach((p, i) => crumbs += ` / <a href="#" data-p="${esc(parts.slice(0, i + 1).join("/"))}">${esc(p)}</a>`);
    $("#crumbs").innerHTML = crumbs;
    $("#crumbs").querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); openDir(root, a.dataset.p); });
    const join = n => d.path ? d.path + "/" + n : n;
    let html = parts.length ? `<div class="item" data-dir="${esc(parts.slice(0, -1).join("/"))}"><span class="ico">⬆</span><span class="name">..</span></div>` : "";
    if (d.dvd) html += `<div class="item" data-dvd="${esc(d.path)}" style="background:var(--accent)"><span class="ico">▶</span><span class="name">Play DVD</span></div>`;
    d.dirs.forEach(x => html += x.dvd
      ? `<div class="item f" data-dvd="${esc(join(x.name))}"><span class="ico">💿</span><span class="name">${esc(x.name)}</span><span class="meta">DVD</span></div>`
      : x.movie
      ? `<div class="item f" data-file="${esc(join(x.name) + "/" + x.movie)}"><span class="ico">🎬</span><span class="name">${esc(x.name)}</span><span class="meta" data-open="${esc(join(x.name))}">📁</span></div>`
      : `<div class="item f" data-dir="${esc(join(x.name))}"><span class="ico">📁</span><span class="name">${esc(x.name)}</span></div>`);
    d.files.forEach(f => html += `<div class="item f" data-file="${esc(join(f.name))}"><span class="ico">🎬</span><span class="name">${esc(f.name)}</span><span class="meta">${fmtSize(f.size)}</span></div>`);
    if (!d.dirs.length && !d.files.length && !d.dvd) html += `<p class="hint">No folders or videos here.</p>`;
    $("#files").innerHTML = html;
    $("#files").querySelectorAll("[data-dir]").forEach(el => el.onclick = () => openDir(root, el.dataset.dir));
    $("#files").querySelectorAll("[data-dvd]").forEach(el => el.onclick = () =>
      play({ type: "dvd", root, path: el.dataset.dvd }, "DVD"));
    $("#files").querySelectorAll("[data-file]").forEach(el => el.onclick = e => {
      if (e.target.dataset.open) return openDir(root, e.target.dataset.open);  // 📁 = look inside
      play({ type: "file", root, path: el.dataset.file }, el.dataset.file.split("/").pop());
    });
    $("#filter").value = "";
    $("#filter").style.display = d.dirs.length + d.files.length > 12 ? "" : "none";
    window.scrollTo(0, 0);
  } catch (e) { toast(e.message); }
}

$("#filter").oninput = () => {
  const words = $("#filter").value.toLowerCase().split(/\s+/).filter(Boolean);
  document.querySelectorAll("#files .f").forEach(el => {
    const name = el.querySelector(".name").textContent.toLowerCase();
    el.style.display = words.every(w => name.includes(w)) ? "" : "none";
  });
};

async function initNas() {
  try {
    const info = await api("/api/info");
    if (!info.roots.length) { $("#files").innerHTML = `<p class="hint">No NAS folders configured. Add them to "media_roots" in config.json on the PC.</p>`; return; }
    $("#root").innerHTML = info.roots.map(r => `<option>${esc(r)}</option>`).join("");
    const pos = store.get("nasPos", null);
    const root = pos && info.roots.includes(pos.root) ? pos.root : info.roots[0];
    $("#root").value = root;
    $("#root").onchange = () => openDir($("#root").value, "");
    openDir(root, pos && pos.root === root ? pos.path : "");
  } catch (e) { toast(e.message); }
}

// Favorites (stored on the PC in favorites.json, shared by every phone)
let favs = { youtube: [], twitch: [] };
async function saveFav(body) {
  try { favs = await api("/api/favorites", body); renderYtFavs(); renderTwFavs(); return true; }
  catch (e) { toast(e.message); return false; }
}
async function loadFavs() {
  try { favs = await api("/api/favorites"); } catch (e) { toast(e.message); }
  // one-time move of Twitch channels saved in this phone's browser by the older version
  const old = store.get("twFavs", []);
  if (old.length) {
    for (const name of old.slice().reverse()) await saveFav({ kind: "twitch", action: "add", name });
    store.set("twFavs", []);
  }
  renderYtFavs(); renderTwFavs();
  if ($("#tw").classList.contains("active")) refreshTwitch();
}

// YouTube
let ytChannel = null;  // channel currently shown, if any
const isSaved = url => favs.youtube.some(c => c.url === url);

function videoList(videos) {
  $("#ytResults").innerHTML = videos.map((v, i) => `
    <div class="vid" data-i="${i}">
      <img src="${esc(v.thumb)}" alt="" loading="lazy">
      <div><div class="t">${esc(v.title)}</div>
      <div class="meta">${ytChannel || !v.channel_url ? esc(v.channel) : `<span class="chlink" data-ch="${esc(v.channel_url)}">${esc(v.channel)}</span>`}${v.duration ? " · " + fmtTime(v.duration) : ""} ${v.live ? '<span class="live">LIVE</span>' : ""}</div></div>
    </div>`).join("") || `<p class="hint">Nothing found.</p>`;
  $("#ytResults").querySelectorAll(".vid").forEach(el => el.onclick = e => {
    if (e.target.dataset.ch) return openChannel(e.target.dataset.ch);
    const v = videos[el.dataset.i]; play({ type: "url", url: v.url }, v.title);
  });
}

function renderYtFavs() {
  $("#ytFavs").innerHTML = favs.youtube.map((c, i) => `
    <div class="fav${ytChannel && ytChannel.url === c.url ? " on" : ""}" data-i="${i}">
      ${c.avatar ? `<img src="${esc(c.avatar)}" alt="" loading="lazy">` : `<div class="ph">${esc(c.name[0] || "?")}</div>`}
      <span>${esc(c.name)}</span></div>`).join("");
  $("#ytFavs").style.display = favs.youtube.length ? "" : "none";
  $("#ytFavs").querySelectorAll(".fav").forEach(el => el.onclick = () => openChannel(favs.youtube[el.dataset.i].url));
  if (ytChannel) renderChannelHead();
}

function renderChannelHead() {
  const c = ytChannel, saved = isSaved(c.url);
  $("#ytHead").innerHTML = `
    <div class="chhead">
      ${c.avatar ? `<img src="${esc(c.avatar)}" alt="">` : ""}
      <div class="n">${esc(c.name)}</div>
      <button class="star" id="ytStar">${saved ? "★ Saved" : "☆ Save"}</button>
    </div>
    <div class="seg">
      <button data-tab="videos" class="${c.tab === "videos" ? "active" : ""}">Videos</button>
      <button data-tab="streams" class="${c.tab === "streams" ? "active" : ""}">Streams</button>
      <button class="lv" id="ytLive">🔴 Live</button>
    </div>`;
  $("#ytStar").onclick = async () => {
    if (saved && !confirm(`Remove ${c.name} from saved channels?`)) return;
    $("#ytStar").textContent = "…";
    await saveFav(saved ? { kind: "youtube", action: "remove", url: c.url } : { kind: "youtube", action: "add", channel: c.url });
    if (!saved && isSaved(c.url)) toast("★ " + c.name + " saved", true);
  };
  $("#ytLive").onclick = () => play({ type: "url", url: c.url + "/live" }, c.name + " live");
  $("#ytHead").querySelectorAll("[data-tab]").forEach(b => b.onclick = () => openChannel(c.url, b.dataset.tab));
}

async function openChannel(url, tab = "videos") {
  ytChannel = { url, tab, name: (favs.youtube.find(c => c.url === url) || {}).name || "Loading…" };
  renderYtFavs(); renderChannelHead();
  $("#ytResults").innerHTML = `<p class="hint">Loading channel…</p>`;
  window.scrollTo(0, 0);
  try {
    const ch = await api(`/api/youtube/channel?tab=${tab}&url=` + encodeURIComponent(url));
    if (!ytChannel || ytChannel.url !== url) return;  // user moved on meanwhile
    ytChannel = { ...ch, tab };
    renderYtFavs(); renderChannelHead(); videoList(ch.videos);
  } catch (e) { $("#ytResults").innerHTML = ""; toast(e.message); }
}

$("#ytForm").onsubmit = async e => {
  e.preventDefault();
  const q = $("#ytQ").value.trim(); if (!q) return;
  $("#ytQ").blur();
  if (/^@\S+$/.test(q) || /youtube\.com\/(@|channel\/|c\/|user\/)/.test(q)) return openChannel(q);
  if (/^https?:\/\//.test(q)) return play({ type: "url", url: q }, "video");
  ytChannel = null; $("#ytHead").innerHTML = ""; renderYtFavs();
  $("#ytResults").innerHTML = `<p class="hint">Searching…</p>`;
  try {
    const { results } = await api("/api/youtube/search?q=" + encodeURIComponent(q));
    videoList(results);
  } catch (err) { $("#ytResults").innerHTML = ""; toast(err.message); }
};

// Twitch
let twStatus = {};        // login -> {display, live, title, preview, exists}
let twChecking = false;
const twLogin = s => s.trim().replace(/^https?:\/\/(www\.)?twitch\.tv\//, "").replace(/[/?#].*$/, "").toLowerCase();

function renderTwFavs() {
  const list = favs.twitch.slice().sort((a, b) =>
    (!!(twStatus[b] || {}).live - !!(twStatus[a] || {}).live) || a.localeCompare(b));
  const liveCount = list.filter(c => (twStatus[c] || {}).live).length;
  $("#twInfo").textContent = !list.length ? "" : twChecking && !Object.keys(twStatus).length
    ? "Checking who is live…" : `${liveCount} of ${list.length} live`;
  $("#twEdit").style.display = list.length ? "" : "none";
  $("#twFavs").innerHTML = list.map(c => {
    const s = twStatus[c];
    const cls = !s ? "checking" : s.live ? "is-live" : "is-off";
    const sub = !s ? "checking…" : s.live ? esc(s.title || "Live now") : s.exists === false ? "channel not found" : "offline";
    const pic = s && s.live && s.preview
      ? `<img class="pv" src="${esc(s.preview)}" alt="" loading="lazy"><span class="badge">LIVE</span>`
      : `<div class="ph">${esc(c[0].toUpperCase())}</div>`;
    return `<div class="tw ${cls}" data-c="${esc(c)}">${pic}
      <div class="info"><div class="n">${esc(s ? s.display : c)}</div><div class="s">${sub}</div></div>
      <button class="del" data-x="${esc(c)}">✕</button></div>`;
  }).join("") || `<p class="hint">No favorites yet. Type a channel name above and tap ☆ to save it.</p>`;
  $("#twFavs").querySelectorAll(".tw").forEach(el => el.onclick = e => {
    if (e.target.dataset.x) {
      delete twStatus[e.target.dataset.x];
      return saveFav({ kind: "twitch", action: "remove", name: e.target.dataset.x });
    }
    if ($("#twFavs").classList.contains("editing")) return;
    const s = twStatus[el.dataset.c];
    if (s && !s.live && !confirm(`${s.display} seems to be offline. Try anyway?`)) return;
    playTwitch(el.dataset.c);
  });
}

let twTimer;
async function refreshTwitch() {
  clearTimeout(twTimer);
  if (!favs.twitch.length) return renderTwFavs();
  twChecking = true; renderTwFavs();
  try {
    const { channels } = await api("/api/twitch/status");
    twStatus = {};
    channels.filter(s => !s.error).forEach(s => twStatus[s.name] = s);
  } catch (e) { toast(e.message); }
  twChecking = false; renderTwFavs();
  // keep it fresh while the Twitch tab is open
  twTimer = setTimeout(() => { if (!document.hidden && $("#tw").classList.contains("active")) refreshTwitch(); }, 60000);
}

function playTwitch(ch) {
  ch = twLogin(ch);
  if (ch) play({ type: "url", url: "https://www.twitch.tv/" + ch }, ch);
}
$("#twForm").onsubmit = e => { e.preventDefault(); playTwitch($("#twQ").value); };
$("#twSave").onclick = async () => {
  const ch = twLogin($("#twQ").value);
  if (!ch) return toast("Type a channel name first");
  if (favs.twitch.includes(ch)) return toast(ch + " is already saved", true);
  if (await saveFav({ kind: "twitch", action: "add", name: ch })) {
    toast("★ " + ch + " saved", true); $("#twQ").value = ""; refreshTwitch();
  }
};
$("#twEdit").onclick = () => {
  const on = $("#twFavs").classList.toggle("editing");
  $("#twEdit").textContent = on ? "Done" : "Edit";
};
document.querySelector('nav button[data-tab="tw"]').addEventListener("click", refreshTwitch);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && $("#tw").classList.contains("active")) refreshTwitch();
});

// Link
$("#linkForm").onsubmit = e => { e.preventDefault(); const u = $("#linkQ").value.trim(); if (u) play({ type: "url", url: u }, "link"); };

// Remote
document.querySelectorAll(".ctl button").forEach(b => b.onclick = async () => {
  try { await api("/api/control", { cmd: b.dataset.cmd, val: b.dataset.val }); poll(); }
  catch (e) { toast(e.message); }
});

let pollTimer;
async function poll() {
  clearTimeout(pollTimer);
  try {
    const s = await api("/api/status");
    $("#now").textContent = s.title || "Nothing playing";
    let st = s.state;
    if (s.length > 0) st += ` · ${fmtTime(s.time)} / ${fmtTime(s.length)}`;
    else if (s.time) st += ` · ${fmtTime(s.time)}`;
    if (s.volume !== undefined) st += ` · vol ${s.volume}%`;
    $("#state").textContent = st;
    $("#bar div").style.width = s.length > 0 ? (100 * s.time / s.length) + "%" : "0";
    $("#pp").textContent = s.state === "playing" ? "⏸" : "▶";
    document.querySelectorAll(".pl").forEach(b => b.hidden = !s.playlist);
    $("#dvdPad").hidden = !s.dvd;
    document.body.style.paddingBottom = $("#remote").offsetHeight + 20 + "px";
  } catch { $("#state").textContent = "PC not reachable"; }
  pollTimer = setTimeout(poll, document.hidden ? 10000 : 2000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

// Tap on progress bar to seek
$("#bar").onclick = async e => {
  const pct = Math.round(100 * e.offsetX / e.currentTarget.clientWidth);
  try { await api("/api/control", { cmd: "seek", val: pct + "%" }); poll(); } catch (err) { toast(err.message); }
};

initNas();
loadFavs();
poll();
</script>
</body>
</html>
